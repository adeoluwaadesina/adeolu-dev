<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Archery</title>
<meta name="description" content="Beat the wind, pull the perfect draw, climb the archery ladder." />
<style>
  :root {
    --sky-top: #6fb7e6;
    --sky-horizon: #cfe9f5;
    --ground-near: #2f5233;
    --ground-far: #4f7a4a;
    --gold: #f6c453;
    --paper: #fdf8ef;
    --panel: rgba(16, 24, 32, 0.92);
    --hud: rgba(10, 16, 14, 0.42);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: #1a1a1a;
    color: var(--paper);
    touch-action: none;
    user-select: none;
  }
  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
  }

  /* --- scene: sky, mountains, trees, ground, target --- */
  #scene {
    flex: 1;
    position: relative;
    min-height: 0;
    overflow: hidden;
    background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-horizon) 56%, var(--ground-far) 58%, var(--ground-near) 100%);
  }
  #mountains {
    position: absolute;
    left: 0; right: 0;
    top: 0;
    height: 58%;
    width: 100%;
  }
  .tree {
    position: absolute;
    bottom: 42%;
    width: 0;
    height: 0;
    border-left: 13px solid transparent;
    border-right: 13px solid transparent;
    border-bottom: 34px solid #2d4a2e;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,0.12));
  }
  .tree::after {
    content: '';
    position: absolute;
    left: -9px;
    top: 22px;
    width: 18px;
    height: 14px;
    background: #6b4a2f;
  }
  #lanes { position: absolute; inset: 0; width: 100%; height: 100%; }

  #target-stand {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center bottom;
    transition: transform 0.25s ease, top 0.25s ease;
  }
  #target-canvas { display: block; width: 190px; height: 190px; }
  .stand-leg {
    position: absolute;
    bottom: -26px;
    width: 10px;
    height: 30px;
    background: #6b4a2f;
  }
  .stand-leg.left { left: 36%; transform: skewX(-12deg); }
  .stand-leg.right { right: 36%; transform: skewX(12deg); }

  .distance-badge {
    position: absolute;
    left: 12px;
    bottom: 12px;
    background: #c0392b;
    color: #fff;
    font-weight: 800;
    font-size: 13px;
    padding: 5px 10px;
    border-radius: 4px;
    letter-spacing: 0.02em;
  }

  /* --- HUD overlay on top of the scene --- */
  .hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: env(safe-area-inset-top, 14px) 16px 10px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .tier-name {
    font-weight: 800;
    font-size: 22px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
  .round-info {
    opacity: 0.9;
    font-size: 12px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
  }
  .wind-box { text-align: right; }
  .wind-label { font-size: 11px; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.06em; text-shadow: 0 1px 3px rgba(0,0,0,0.4); }
  .wind-value {
    font-size: 22px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 4px;
    justify-content: flex-end;
    text-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
  .wind-arrow { display: inline-block; transition: transform 0.2s ease; }

  .icon-row {
    position: absolute;
    top: 64px;
    left: 16px;
    right: 16px;
    display: flex;
    justify-content: space-between;
  }
  .icon-btn {
    background: var(--hud);
    backdrop-filter: blur(2px);
    border: 1px solid rgba(255,255,255,0.25);
    color: var(--paper);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
  }

  .shot-result {
    position: absolute;
    top: 112px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.55);
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 800;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .shot-result.show { opacity: 1; }

  /* --- controls below the scene --- */
  #controls {
    padding: 8px 16px calc(env(safe-area-inset-bottom, 10px) + 10px);
    background: #16211a;
  }
  .hint {
    font-size: 12px;
    opacity: 0.7;
    text-align: center;
    margin: 0 0 8px;
  }
  #charge-bar {
    height: 8px;
    border-radius: 4px;
    background: rgba(0,0,0,0.35);
    overflow: hidden;
  }
  #charge-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(to right, #e0543c, var(--gold));
    transform: scaleX(0);
    transform-origin: left;
  }

  .panel-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .panel-overlay.open { display: flex; }
  .panel {
    background: var(--panel);
    border-radius: 16px;
    padding: 22px;
    width: min(92vw, 420px);
    max-height: 80vh;
    overflow-y: auto;
  }
  .panel h2 { margin: 0 0 14px; font-size: 18px; }
  .panel-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .panel-row:last-child { border-bottom: none; }
  .row-name { font-size: 14px; }
  .row-sub { font-size: 11px; opacity: 0.6; }
  .row-btn {
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    background: var(--gold);
    color: #1a1a1a;
  }
  .row-btn[disabled] { opacity: 0.5; background: rgba(255,255,255,0.15); color: var(--paper); }
  .row-btn.locked { background: rgba(255,255,255,0.1); color: var(--paper); }
  .close-panel {
    width: 100%;
    margin-top: 12px;
    border: none;
    border-radius: 10px;
    padding: 12px;
    background: rgba(255,255,255,0.1);
    color: var(--paper);
    font-size: 14px;
  }

  #round-end {
    position: fixed;
    inset: auto 16px 16px 16px;
    max-width: 448px;
    margin: 0 auto;
    background: var(--panel);
    border-radius: 16px;
    padding: 20px;
    display: none;
    z-index: 11;
  }
  #round-end.open { display: block; }
  #round-end h2 { margin: 0 0 6px; font-size: 18px; }
  #round-end p { margin: 0 0 14px; opacity: 0.8; font-size: 13px; }
  #round-end button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 14px;
    font-weight: 700;
    background: var(--gold);
    color: #1a1a1a;
  }

  #leaderboard-sheet {
    position: fixed;
    inset: auto 0 0 0;
    background: var(--panel);
    border-top: 1px solid rgba(255,255,255,0.15);
    border-radius: 18px 18px 0 0;
    padding: 20px;
    transform: translateY(100%);
    transition: transform 0.2s ease;
    max-width: 480px;
    margin: 0 auto;
    z-index: 12;
  }
  #leaderboard-sheet.open { transform: translateY(0); }
  #leaderboard-sheet h2 { margin: 0 0 14px; font-size: 18px; }
  #leaderboard-list { list-style: none; margin: 0 0 14px; padding: 0; font-size: 14px; }
  #leaderboard-list li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .leaderboard-me { font-size: 12px; opacity: 0.75; text-align: center; margin: 0 0 12px; }
  /* Range identity and a thumb-friendly instrument panel. */
  body { background: #101e1b; }
  #scene { background: #c8ddd3; }
  #mountains, .tree, #lanes { display: none; }
  #landscape, #effects { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #effects { z-index: 2; }
  .hud { padding: max(20px, env(safe-area-inset-top)) 22px 14px; color: #203c36; }
  .hud::before { content: ''; position: absolute; inset: 0 0 -55px; background: linear-gradient(#f6f3e7 20%,#f6f3e7e8 68%,transparent); z-index: 0; pointer-events: none; }
  .hud > div { position: relative; }
  .tier-name { font-family: Georgia,serif; font-size: 29px; font-weight: 500; text-shadow: none; }
  .tier-name::before { content: 'LULUGAMES / LAGOS RANGE'; display: block; font: 9px -apple-system,sans-serif; letter-spacing: 2px; margin-bottom: 9px; }
  .round-info { margin-top: 6px; text-shadow: none; font-size: 11px; }
  .wind-box { padding-top: 23px; }
  .wind-label, .wind-value { text-shadow: none; }
  .wind-label { font-size: 9px; letter-spacing: 1.8px; }
  .wind-value { font-size: 22px; }
  .icon-row { top: 112px; left: 22px; right: 22px; gap: 6px; z-index: 3; }
  .icon-btn { min-height: 44px; padding: 8px 11px; background: #f8f6ecdc; border: 1px solid #24453725; color: #244537; font-size: 11px; }
  button { cursor: pointer; touch-action: manipulation; }
  button:active { filter: brightness(.9); }
  button:focus-visible { outline: 3px solid #dba94e; outline-offset: 3px; }
  #target-canvas { filter: drop-shadow(3px 8px 4px #14281a55); }
  .stand-leg { background: linear-gradient(90deg,#614025,#bf9563,#795330); height: 53px; bottom: -40px; border-radius: 2px; z-index: -1; }
  #target-stand::after { content: ''; position: absolute; width: 90px; height: 10px; background: #142b2466; border-radius: 50%; bottom: -44px; left: 50%; transform: translateX(-50%); filter: blur(4px); z-index: -2; }
  .distance-badge { bottom: 22px; left: 22px; background: #16352cc9; font: 11px monospace; padding: 9px 12px; border: 1px solid #f7f3e140; border-radius: 6px; }
  .shot-result { top: 177px; z-index: 4; white-space: nowrap; font-size: 13px; background: #173b32ed; color: #fff4d1; padding: 10px 18px; }
  #controls { padding: 17px 22px max(22px,env(safe-area-inset-bottom)); background: #162e27; border-top: 1px solid #f7e9b926; }
  .draw-labels { display: flex; justify-content: space-between; color: #e9e6d4; font-size: 10px; letter-spacing: 1.6px; margin: 0 0 10px; }
  #draw-label { color: #efcc79; letter-spacing: .5px; }
  #charge-bar { height: 12px; overflow: visible; position: relative; background: #0c201b; }
  #charge-bar::after { content: ''; position: absolute; left: 55%; width: 10%; top: -4px; bottom: -4px; border: 1px solid #ffefb1; border-radius: 3px; }
  #charge-fill { border-radius: 4px; background: linear-gradient(90deg,#657f64,#e8c674 60%,#d87957); }
  .hint { margin: 14px 0 0; font-size: 11px; line-height: 1.6; opacity: .8; }
  .panel, #round-end, #leaderboard-sheet { background: #17352e; border: 1px solid #d2cdaa35; box-shadow: 0 15px 70px #0005; }
  .panel-overlay { backdrop-filter: blur(5px); touch-action: pan-y; }
  .row-btn { min-height: 44px; }
  #shot-strip { position: absolute; bottom: 23px; right: 22px; display: flex; gap: 6px; z-index: 3; }
  #shot-strip span { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #16352cbf; border: 1px solid #f7f3e166; font: 12px monospace; }
  @media (max-height: 650px) { .icon-row { top: 98px; } .shot-result { top: 148px; } #controls { padding-top: 10px; padding-bottom: 12px; } }
</style>
</head>
<body>
  <div id="app">
    <div id="scene">
      <canvas id="landscape" aria-hidden="true"></canvas>
      <canvas id="effects" aria-hidden="true"></canvas>
      <svg id="mountains" viewBox="0 0 400 140" preserveAspectRatio="none">
        <polygon points="0,140 0,70 60,30 120,75 170,40 230,80 280,35 340,72 400,45 400,140" fill="#9fb7c9" opacity="0.65" />
        <polygon points="0,140 0,95 70,55 140,98 210,60 270,100 330,65 400,92 400,140" fill="#7e9aad" opacity="0.8" />
      </svg>

      <div class="tree" style="left:6%"></div>
      <div class="tree" style="left:13%; bottom:40%; transform:scale(0.8)"></div>
      <div class="tree" style="left:20%; bottom:43%; transform:scale(0.65)"></div>
      <div class="tree" style="right:6%"></div>
      <div class="tree" style="right:13%; bottom:40%; transform:scale(0.8)"></div>
      <div class="tree" style="right:20%; bottom:43%; transform:scale(0.65)"></div>

      <svg id="lanes" viewBox="0 0 100 100" preserveAspectRatio="none">
        <polyline points="2,100 47,60" stroke="rgba(255,255,255,0.55)" stroke-width="0.6" fill="none" />
        <polyline points="98,100 53,60" stroke="rgba(255,255,255,0.55)" stroke-width="0.6" fill="none" />
      </svg>

      <div id="target-stand">
        <canvas id="target-canvas" width="340" height="340"></canvas>
        <div class="stand-leg left"></div>
        <div class="stand-leg right"></div>
      </div>

      <div class="distance-badge" id="distance-badge">20ft</div>

      <header class="hud">
        <div>
          <div class="tier-name" id="tier-name">Beginner</div>
          <div class="round-info" id="round-info">Arrow 1 / 3 &middot; Best 0</div>
        </div>
        <div class="wind-box">
          <div class="wind-label">Wind</div>
          <div class="wind-value"><span class="wind-arrow" id="wind-arrow">&#10148;</span><span id="wind-speed">0</span></div>
        </div>
      </header>

      <div class="icon-row">
        <button class="icon-btn" id="ladder-btn">Ladder</button>
        <button class="icon-btn" id="shop-btn">Shop</button>
        <button class="icon-btn" id="leaderboard-btn">Leaderboard</button>
        <button class="icon-btn" id="sound-btn" aria-pressed="false">Sound on</button>
      </div>

      <div class="shot-result" id="shot-result"></div>
      <div id="shot-strip" aria-label="Arrow scores"><span>—</span><span>—</span><span>—</span></div>
    </div>

    <div id="controls">
      <div class="draw-labels"><span>DRAW STRENGTH</span><span id="draw-label">Find the gold zone</span></div>
      <div id="charge-bar"><div id="charge-fill"></div></div>
      <p class="hint">Hold &amp; drag to aim · release in the gold zone<br>Watch the wind. Steady hand, sharp eye.</p>
    </div>
  </div>

  <div id="round-end">
    <h2 id="round-end-title">Round complete</h2>
    <p id="round-end-sub"></p>
    <button id="round-end-btn">Continue</button>
  </div>

  <div class="panel-overlay" id="ladder-overlay">
    <div class="panel">
      <h2>Ladder</h2>
      <div id="ladder-rows"></div>
      <button class="close-panel" data-close="ladder-overlay">Close</button>
    </div>
  </div>

  <div class="panel-overlay" id="shop-overlay">
    <div class="panel">
      <h2>Shop</h2>
      <div id="shop-rows"></div>
      <button class="close-panel" data-close="shop-overlay">Close</button>
    </div>
  </div>

  <div id="leaderboard-sheet">
    <h2>Top Archers</h2>
    <ol id="leaderboard-list"></ol>
    <p class="leaderboard-me" id="leaderboard-me"></p>
    <button class="close-panel" id="close-leaderboard">Close</button>
  </div>

  <script src="https://lagoslife.app/sdk/vatar-games-v1.js"></script>
  <script src="/kit/vatar-helpers.js"></script>
  <script>
  (async function () {
    const TIERS = [
      { id: 'beginner', name: 'Beginner', windMax: 2, targetRadius: 150, pass: 12, distanceFt: 20, visualScale: 1.0, visualTop: '58%' },
      { id: 'novice', name: 'Novice', windMax: 5, targetRadius: 130, pass: 15, distanceFt: 30, visualScale: 0.86, visualTop: '55%' },
      { id: 'skilled', name: 'Skilled', windMax: 8, targetRadius: 110, pass: 17, distanceFt: 40, visualScale: 0.72, visualTop: '52%' },
      { id: 'pro', name: 'Pro', windMax: 12, targetRadius: 92, pass: 19, distanceFt: 50, visualScale: 0.6, visualTop: '49%' },
      { id: 'expert', name: 'Expert', windMax: 16, targetRadius: 76, pass: 21, distanceFt: 65, visualScale: 0.48, visualTop: '46%' },
    ];
    const IDEAL_POWER = 0.6;
    const ARROWS_PER_ROUND = 3;
    const CHARGE_MS = 1600;
    const MAX_HOLD_MS = 2300;
    const AIM_RANGE_PX = 150;
    // center -> outer: gold, gold, red, red, blue, blue, black, black, white, white
    const RING_COLORS = ['#f6c453', '#f6c453', '#d94c3a', '#d94c3a', '#3a6fd9', '#3a6fd9', '#1a1a1a', '#1a1a1a', '#fdf8ef', '#fdf8ef'];

    const canvas = document.getElementById('target-canvas');
    const ctx = canvas.getContext('2d');
    const scene = document.getElementById('scene');
    const targetStand = document.getElementById('target-stand');
    const distanceBadge = document.getElementById('distance-badge');
    const tierNameEl = document.getElementById('tier-name');
    const roundInfoEl = document.getElementById('round-info');
    const windArrowEl = document.getElementById('wind-arrow');
    const windSpeedEl = document.getElementById('wind-speed');
    const shotResultEl = document.getElementById('shot-result');
    const chargeFill = document.getElementById('charge-fill');
    const roundEndEl = document.getElementById('round-end');
    const roundEndTitle = document.getElementById('round-end-title');
    const roundEndSub = document.getElementById('round-end-sub');
    const roundEndBtn = document.getElementById('round-end-btn');
    const ladderOverlay = document.getElementById('ladder-overlay');
    const ladderRows = document.getElementById('ladder-rows');
    const shopOverlay = document.getElementById('shop-overlay');
    const shopRows = document.getElementById('shop-rows');
    const leaderboardSheet = document.getElementById('leaderboard-sheet');
    const leaderboardList = document.getElementById('leaderboard-list');
    const leaderboardMe = document.getElementById('leaderboard-me');

    let paused = false;
    let unlockedTierIndex = 0;
    let currentTierIndex = 0;
    let bestRoundTotal = 0;
    let owned = { bow_gold: false, trail_flame: false, expert_unlock: false };

    let arrowsShot = 0;
    let roundScores = [];
    let landedShots = [];
    let lastPop = null;
    let wind = { speed: 0, dir: 1 };
    let aimX = 0; // -1..1 relative to target radius
    let aimY = 0; // -1..1 relative to target radius
    let power = 0; // 0..1
    let lastSubmittedScore = 0;
    let aiming = false;
    let aimAnchorX = 0;
    let aimAnchorY = 0;
    let holdStartTime = 0;
    let holdRAF = null;
    let autoReleaseTimer = null;
    let aimPointer = null;
    let flight = null;
    let particles = [];
    let gameTime = 0;
    let effectRAF = null;
    let effectLast = null;
    let jobs = [];
    let sdkPaused = false;
    let muted = false;
    let audio = null;
    let impactTime = -10;
    let resultUntil = 0;
    const landscape = document.getElementById('landscape');
    const effects = document.getElementById('effects');
    const fx = effects.getContext('2d');
    const drawLabel = document.getElementById('draw-label');
    let sceneWidth = 375, sceneHeight = 650;
    const later = (fn, seconds) => jobs.push({ fn, at: gameTime + seconds });

    function unlockSound() {
      if (!audio) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audio = new AC(); }
      if (audio && !paused && !muted) audio.resume().catch(() => {});
    }
    function tone(frequency, duration, volume = .06, type = 'sine', end = frequency) {
      if (!audio || muted || paused || audio.state !== 'running') return;
      const osc = audio.createOscillator(), gain = audio.createGain(), at = audio.currentTime;
      osc.type = type; osc.frequency.setValueAtTime(frequency, at); osc.frequency.exponentialRampToValueAtTime(Math.max(20,end), at + duration);
      gain.gain.setValueAtTime(volume, at); gain.gain.exponentialRampToValueAtTime(.001, at + duration);
      osc.connect(gain).connect(audio.destination); osc.start(at); osc.stop(at + duration);
    }
    document.getElementById('sound-btn').addEventListener('click', (e) => {
      muted = !muted; e.currentTarget.textContent = muted ? 'Sound off' : 'Sound on'; e.currentTarget.setAttribute('aria-pressed', String(muted));
      if (muted) audio?.suspend(); else unlockSound();
    });

    function paintLandscape() {
      sceneWidth = scene.clientWidth; sceneHeight = scene.clientHeight;
      const dpr = Math.min(devicePixelRatio || 1, 2);
      for (const c of [landscape,effects]) { c.width = sceneWidth*dpr; c.height = sceneHeight*dpr; c.getContext('2d').setTransform(dpr,0,0,dpr,0,0); }
      const c = landscape.getContext('2d'), w = sceneWidth, h = sceneHeight, horizon = h*.56;
      let g = c.createLinearGradient(0,0,0,horizon); g.addColorStop(0,'#b4d8d5'); g.addColorStop(1,'#f4e9bd'); c.fillStyle = g; c.fillRect(0,0,w,h);
      g=c.createRadialGradient(w*.76,h*.29,2,w*.76,h*.29,w*.5);g.addColorStop(0,'#fff5ccbb');g.addColorStop(1,'#fff5cc00');c.fillStyle=g;c.fillRect(0,0,w,horizon);
      c.fillStyle='#fff7d7';c.beginPath();c.arc(w*.76,h*.29,22,0,Math.PI*2);c.fill();
      // Hazy, faceted hills create depth without shipping a background image.
      for(let layer=0;layer<3;layer++){
        const base=horizon+layer*6, peaks=layer===0?[[-.1,.35],[.12,.14],[.3,.33],[.53,.23],[.69,.34],[.85,.18],[1.12,.39]]:[[-.1,.38],[.16,.30+layer*.025],[.42,.41],[.72,.31+layer*.04],[1.1,.4]];
        c.fillStyle=['#aec5bc','#8fae9e','#789b85'][layer];c.beginPath();c.moveTo(-20,base);for(const [x,y] of peaks)c.lineTo(x*w,y*h);c.lineTo(w+20,base);c.fill();
        for(let i=1;i<peaks.length-1;i+=2){const [x,y]=peaks[i];c.fillStyle=['#d2d8c4','#b6c5a6','#95ad8e'][layer];c.beginPath();c.moveTo(x*w,y*h);c.lineTo((x+.025)*w,y*h+35);c.lineTo((x+.12)*w,base);c.lineTo((x+.18)*w,base);c.fill();}
      }

    function newWind(tier) {
      const speed = Math.round(Math.random() * tier.windMax * 10) / 10;
      const dir = Math.random() < 0.5 ? -1 : 1;

    }

    function applyTierVisuals(tier) {

    function startRound(tierIndex) {

    function render() {
      const tier = TIERS[currentTierIndex];
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const R = tier.targetRadius;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // wooden backing board behind the rings
      ctx.beginPath();
      ctx.arc(cx, cy, R + 14, 0, Math.PI * 2);
      ctx.fillStyle = '#caa06a';
      ctx.fill();
      for(let n=0;n<12;n++){ctx.strokeStyle=n%2?'#78543255':'#e9c59588';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,R+3+n,0,Math.PI*2);ctx.stroke();}

      for (let i = 10; i >= 1; i--) {
        ctx.beginPath();
        ctx.arc(cx, cy, (R * i) / 10, 0, Math.PI * 2);
        ctx.fillStyle = RING_COLORS[i - 1];
        ctx.fill();
        ctx.strokeStyle='rgba(27,29,20,.3)';ctx.lineWidth=.8;ctx.stroke();
      }
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.stroke();

      // scoring-ring numbers along the right side, like a real target face
      // (every other ring only — labeling all 9 is too cramped at this display size)
      ctx.font = 'bold 12px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let s = 1; s <= 9; s += 2) {
        const r = (R * (11 - s)) / 10;
        const lx = cx + r - 8;
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.strokeText(String(s), lx, cy);
        ctx.fillStyle = '#1a1a1a';
        ctx.fillText(String(s), lx, cy);
      }

      // reticle preview, offset by current aim (both axes) — outlined so it reads against every ring color
      const reticleX = cx + aimX * R * 1.4;
      const reticleY = cy + aimY * R * 1.4;
      ctx.beginPath();
      ctx.moveTo(reticleX - 11, reticleY);
      ctx.lineTo(reticleX + 11, reticleY);
      ctx.moveTo(reticleX, reticleY - 11);
      ctx.lineTo(reticleX, reticleY + 11);
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      ctx.stroke();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      // charge/timer ring while holding to aim

        ctx.beginPath();
        ctx.arc(reticleX, reticleY, 24, -Math.PI / 2, -Math.PI / 2 + power * Math.PI * 2);
        ctx.lineWidth = 4;
        ctx.strokeStyle = power >= 1 ? '#ff5a3c' : '#ffffff';
        ctx.stroke();
      }

        const iy = cy + s.y;

        const shaftLen = 24;
        const tailX = ix + Math.cos(angle) * shaftLen;
        const tailY = iy + Math.sin(angle) * shaftLen;
        const shaftColor = owned.trail_flame ? '#ff7a3c' : '#5a3a22';
        const fletchColor = owned.trail_flame ? '#ffb347' : '#e8e4da';

        ctx.beginPath();
        ctx.moveTo(ix, iy);
        ctx.lineTo(tailX, tailY);
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = shaftColor;
        ctx.stroke();

        ctx.moveTo(tailX, tailY);

    function scoreForDistance(d, R) {
      if (d > R) return 0;
      const ring = 10 - Math.floor((d / R) * 10);
      return Math.max(1, Math.min(10, ring));
    }

    function showShotResult(score) {
      shotResultEl.textContent = score === 10 ? 'BULLSEYE · +10' : score === 0 ? 'Just wide. Adjust your aim.' : score >= 8 ? `Sharp shot! +${score}` : `On target · +${score}`;
      shotResultEl.classList.add('show');
      resultUntil = gameTime + 1.4;
    }

    function shoot() {
      if (paused || flight || arrowsShot >= ARROWS_PER_ROUND) return;
      const tier = TIERS[currentTierIndex];
      const R = tier.targetRadius;

      const windDrift = wind.speed * wind.dir * 9;
      const powerError = IDEAL_POWER - power;
      const dropOffset = powerError * 240;

      const landX = aimX * R * 1.4 + windDrift;
      const landY = aimY * R * 1.4 + dropOffset;
      const jitter = (Math.random() * 0.6 - 0.3);
      const dist = Math.hypot(landX, landY);
      const score = scoreForDistance(dist, R);
      flight = {x:landX,y:landY,jitter,score,start:gameTime,duration:.42+tier.distanceFt*.004};
      // Belt-and-braces, same reasoning as the draw/release auto-timer:
      // flight normally resolves inside drawEffects() via effectTick's rAF
      // loop, but rAF can stall when backgrounded/throttled. This setTimeout
      // force-resolves the shot if that happens, so the player never gets
      // stuck on "Arrow in flight".
      const thisFlight = flight;
      setTimeout(() => {
        if (flight === thisFlight) { flight = null; landShot(thisFlight); }
      }, thisFlight.duration * 1000 + 250);

      power=0;chargeFill.style.transform='scaleX(0)';drawLabel.textContent='Arrow in flight';render();
    }

    function landShot(shot) {

      if(score>=8){tone(score===10?880:660,.25,.04);later(()=>tone(score===10?1320:880,.3,.03),.1);}

      for(let i=0;i<(score===10?28:12);i++){const a=i*2.399;particles.push({x:hit.x,y:hit.y,vx:Math.cos(a)*(25+i*2),vy:Math.sin(a)*(25+i*2)-30,color:score>=8?'#ffe1a0':'#e0cda3',at:gameTime});}
      roundScores.push(score);
      arrowsShot += 1;
      document.querySelectorAll('#shot-strip span')[arrowsShot-1].textContent=String(score);
      drawLabel.textContent='Find the gold zone';
      showShotResult(score);
      lastPop = { x: landX, y: landY, text: score === 0 ? 'Miss!' : `+${score}` };

      power = 0;
      chargeFill.style.transform = 'scaleX(0)';
      render();
      updateHeader();

      if (arrowsShot >= ARROWS_PER_ROUND) {

      } else {
        wind = newWind(tier);
        updateHeader();
      }
    }

    async function finishRound() {
      const total = roundScores.reduce((a, b) => a + b, 0);
      const tier = TIERS[currentTierIndex];
      const passed = total >= tier.pass;

      if (total > bestRoundTotal) {
        bestRoundTotal = total;
        if (bestRoundTotal !== lastSubmittedScore) {
          try { await vg.submitScore(bestRoundTotal); lastSubmittedScore = bestRoundTotal; } catch (err) { console.warn('[archery] score not submitted',err.code); }
        }
      }

      if (passed && currentTierIndex === unlockedTierIndex && unlockedTierIndex < TIERS.length - 1) {
        unlockedTierIndex += 1;
      }
      vg.saveGame({ unlockedTierIndex, bestRoundTotal }).catch(() => console.warn('[archery] save unavailable'));

      roundEndTitle.textContent = passed ? 'Tier cleared!' : 'Round over';
      const nextTier = TIERS[currentTierIndex + 1];
      roundEndSub.textContent = passed
        ? (nextTier ? `${total}/30 — ${nextTier.name} unlocked.` : `${total}/30 — you've topped the ladder.`)
        : `${total}/30 — needed ${tier.pass} to clear ${tier.name}. Try again.`;
      roundEndBtn.textContent = passed && nextTier ? `Next: ${nextTier.name}` : 'Retry';
      roundEndEl.classList.add('open');
      updateHeader();
      renderLadder();
    }

    roundEndBtn.addEventListener('click', () => {
      const tier = TIERS[currentTierIndex];
      const total = roundScores.reduce((a, b) => a + b, 0);

    // --- unified aim control: press+hold anywhere on the scene, drag to aim,
    // power charges automatically the longer you hold, release to shoot.
    // Holding past MAX_HOLD_MS auto-releases, like the iMessage version. ---
    function isInteractiveTarget(el) {
      return el.closest('button, .panel-overlay, #round-end, #leaderboard-sheet');
    }

    function chargeTick() {
      if (!aiming) return;
      const elapsed = performance.now() - holdStartTime;
      power = Math.min(1, elapsed / CHARGE_MS);
      chargeFill.style.transform = `scaleX(${power})`;
      drawLabel.textContent = power >= .55 && power <= .65 ? 'PERFECT · release!' : power > .65 ? 'Too strong · aim lower' : 'Drawing…';
      render();
      if (elapsed >= MAX_HOLD_MS) {
        endAim();
        return;
      }
      holdRAF = requestAnimationFrame(chargeTick);
    }

    function endAim() {
      if (!aiming) return;
      aiming = false;
      if (holdRAF) cancelAnimationFrame(holdRAF);
      if (autoReleaseTimer) { clearTimeout(autoReleaseTimer); autoReleaseTimer = null; }
      const heldMs = performance.now() - holdStartTime;
      power = Math.min(1, heldMs / CHARGE_MS);
      if(aimPointer!==null && scene.hasPointerCapture(aimPointer)) scene.releasePointerCapture(aimPointer);
      aimPointer=null;
      if (heldMs < 60) {
        // too quick to count as a real draw — cancel without firing
        power = 0;
        aimX = 0;
        aimY = 0;
        chargeFill.style.transform = 'scaleX(0)';
        render();
        return;
      }
      shoot();
    }

    function anyOverlayOpen() {
      return roundEndEl.classList.contains('open')
        || ladderOverlay.classList.contains('open')
        || shopOverlay.classList.contains('open')
        || leaderboardSheet.classList.contains('open');
    }

    scene.addEventListener('pointerdown', (e) => {
      if (paused || aiming || flight || arrowsShot >= ARROWS_PER_ROUND || anyOverlayOpen()) return;
      if (isInteractiveTarget(e.target)) return;
      aiming = true;
      aimPointer=e.pointerId;unlockSound();
      lastPop = null;
      aimAnchorX = e.clientX;
      aimAnchorY = e.clientY;
      holdStartTime = performance.now();
      try { scene.setPointerCapture(e.pointerId); } catch (err) {}
      // belt-and-braces: setTimeout still fires even if rAF is throttled
      // (backgrounded tab, low-power mode), so the auto-release is reliable.
      autoReleaseTimer = setTimeout(() => { if (aiming) endAim(); }, MAX_HOLD_MS);
      chargeTick();
    });
    scene.addEventListener('pointermove', (e) => {
      if (!aiming || e.pointerId !== aimPointer) return;
      const dx = e.clientX - aimAnchorX;
      const dy = e.clientY - aimAnchorY;
      aimX = Math.max(-1, Math.min(1, dx / AIM_RANGE_PX));
      aimY = Math.max(-1, Math.min(1, dy / AIM_RANGE_PX));
    });

    scene.addEventListener('pointercancel', cancelAim);
    scene.addEventListener('lostpointercapture', () => { if(aiming)cancelAim(); });
    function cancelAim() {
      aiming=false;cancelAnimationFrame(holdRAF);clearTimeout(autoReleaseTimer);autoReleaseTimer=null;
      if(aimPointer!==null && scene.hasPointerCapture(aimPointer))scene.releasePointerCapture(aimPointer);
      aimPointer=null;power=0;aimX=0;aimY=0;chargeFill.style.transform='scaleX(0)';drawLabel.textContent='Find the gold zone';
    }

    // --- ladder panel ---
    function renderLadder() {
      ladderRows.innerHTML = '';
      TIERS.forEach((tier, i) => {
        const unlocked = tierUnlocked(i);
        const row = document.createElement('div');
        row.className = 'panel-row';
        row.innerHTML = `
          <div>
            <div class="row-name">${tier.name}</div>
            <div class="row-sub">${tier.distanceFt}ft &middot; wind up to ${tier.windMax} &middot; need ${tier.pass}/30</div>
          </div>
        `;
        const btn = document.createElement('button');
        btn.className = 'row-btn' + (unlocked ? '' : ' locked');
        btn.textContent = unlocked ? 'Play' : 'Locked';
        btn.disabled = !unlocked;
        btn.addEventListener('click', () => {
          ladderOverlay.classList.remove('open');
          startRound(i);
        });
        row.appendChild(btn);
        ladderRows.appendChild(row);
      });
    }

    // --- shop panel ---
    const SHOP_ITEMS = [
      { id: 'bow_gold', name: 'Gold Bow', price: 150, sub: 'Cosmetic bow skin' },
      { id: 'trail_flame', name: 'Flame Arrow Trail', price: 150, sub: 'Cosmetic arrow trail' },
      { id: 'expert_unlock', name: 'Expert Stage Unlock', price: 300, sub: 'Skip straight to Expert' },
    ];
    function renderShop() {
      shopRows.innerHTML = '';
      SHOP_ITEMS.forEach((item) => {
        const row = document.createElement('div');
        row.className = 'panel-row';
        row.innerHTML = `
          <div>
            <div class="row-name">${item.name}</div>
            <div class="row-sub">${item.sub}</div>
          </div>
        `;
        const btn = document.createElement('button');
        btn.className = 'row-btn';
        if (owned[item.id]) {
          btn.textContent = 'Owned';
          btn.disabled = true;
        } else {
          btn.textContent = `₦${item.price}`;
          btn.addEventListener('click', async () => {
            btn.disabled = true;
            btn.textContent = 'Opening…';
            try {
            const res = await vg.purchase(item.id);
            if(vg.devMode&&res.ok){owned[item.id]=true;renderShop();renderLadder();}
            if (!res.ok && !vg.devMode) {
              btn.disabled = false;
              btn.textContent = `₦${item.price}`;
            }
            } catch(err){btn.disabled=false;btn.textContent=`Retry · ₦${item.price}`;}
          });
        }
        row.appendChild(btn);
        shopRows.appendChild(row);
      });
    }

    document.getElementById('ladder-btn').addEventListener('click', () => {
      renderLadder();
      ladderOverlay.classList.add('open');
    });
    document.getElementById('shop-btn').addEventListener('click', () => {
      renderShop();
      shopOverlay.classList.add('open');
    });
    document.querySelectorAll('[data-close]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.getElementById(btn.dataset.close).classList.remove('open');
      });
    });

    document.getElementById('leaderboard-btn').addEventListener('click', async () => {
      leaderboardSheet.classList.add('open');
      leaderboardMe.textContent='Loading…';
      try {
      const { top, me } = await vg.leaderboard();
      leaderboardList.innerHTML = '';
      (top || []).slice(0, 3).forEach((row, i) => {
        const li = document.createElement('li');
        li.textContent = `#${i + 1} ${row.name ?? row.playerId} — ${row.score}`;
        leaderboardList.appendChild(li);
      });
      leaderboardMe.textContent = me ? me.label : '';
      if(!top?.length)leaderboardMe.textContent=vg.devMode?'Local practice · leaderboard is available in Lagos Life.':'No scores yet. Take the first shot!';
      }catch{leaderboardMe.textContent='Leaderboard unavailable. Try again shortly.';}
    });
    document.getElementById('close-leaderboard').addEventListener('click', () => {
      leaderboardSheet.classList.remove('open');
    });

    function syncPause() {
      paused=sdkPaused || document.hidden || ladderOverlay.classList.contains('open') || shopOverlay.classList.contains('open') || leaderboardSheet.classList.contains('open');
      if(paused){cancelAim();cancelAnimationFrame(effectRAF);effectRAF=null;audio?.suspend();render();}
      else {effectLast=null;if(!muted && audio)audio.resume().catch(()=>{});if(effectRAF===null)effectRAF=requestAnimationFrame(effectTick);}
    }
    vg.onPause(() => {sdkPaused=true;syncPause();});
    vg.onResume(() => {sdkPaused=false;syncPause();});
    document.addEventListener('visibilitychange',syncPause);
    for(const overlay of [ladderOverlay,shopOverlay,leaderboardSheet])new MutationObserver(syncPause).observe(overlay,{attributes:true,attributeFilter:['class']});

    renderLadder();
    renderShop();
    startRound(currentTierIndex);
    paintLandscape();syncPause();
  })().catch(err => { console.error(err); document.getElementById('shot-result').textContent='Could not connect. Reload to try again.';document.getElementById('shot-result').classList.add('show'); });
  </script>
</body>
</html>
